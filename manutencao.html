<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Em manutenção — LA Publisher</title>
<!-- CSS embutido de propósito: esta página é servida pelo NGINX quando a
     aplicação está fora do ar. Se ela dependesse de um arquivo externo
     servido pelo Node, apareceria sem estilo justamente na hora do problema. -->
<style>
  *{box-sizing:border-box;margin:0}
  body{font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;
    padding:2rem;color:#e9ecfb;
    background:radial-gradient(1000px 500px at 15% -10%,rgba(108,92,255,.35),transparent 60%),
               radial-gradient(800px 450px at 110% 110%,rgba(34,211,238,.2),transparent 55%),#0d1020}
  .cx{max-width:460px;text-align:center;background:#171c36;border:1px solid #2a3159;border-radius:18px;
    padding:2.4rem 2rem;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .ico{width:44px;height:44px;border-radius:13px;margin:0 auto 1.1rem;display:grid;place-items:center;
    background:linear-gradient(135deg,#6c5cff,#22d3ee);color:#fff;font-size:1.3rem}
  h1{font-size:1.25rem;margin-bottom:.6rem;letter-spacing:-.01em}
  p{color:#a3abd8;font-size:.95rem}
  .nota{margin-top:1.4rem;padding-top:1.1rem;border-top:1px solid #2a3159;color:#727ba9;font-size:.82rem}
</style>
</head>
<body>
  <div class="cx">
    <div class="ico">◆</div>
    <h1>Voltamos já</h1>
    <p>O LA Publisher está fora do ar por alguns instantes — normalmente uma
       atualização. Nada do que você agendou se perde: a fila retoma sozinha
       assim que o sistema volta.</p>
    <p class="nota">Atualize a página em um minuto.</p>
  </div>
</body>
</html>
