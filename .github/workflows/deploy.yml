# ==========================================================================
#  Entrega automática — LA Publisher
#
#  Dois trabalhos em sequência: PROVAR e ENTREGAR. O segundo só existe se o
#  primeiro passar (`needs`), então suíte vermelha não vira serviço no ar.
#
#  Aqui isso pesa mais que nos sites: este é o sistema que PUBLICA nas redes
#  dos clientes. Um defeito aqui não deixa uma página feia — publica errado, ou
#  duplica, na conta de outra pessoa.
#
#  A CHAVE DESTE WORKFLOW NÃO DÁ SHELL: no servidor ela está presa a um
#  `command=` com `restrict`. Provado com ela apontando para um `echo` antes de
#  ser ligada no deploy — pedir o cofre de tokens, pedir /etc/shadow e abrir
#  terminal devolveram o echo, e o túnel para a porta 5190 foi recusado.
# ==========================================================================
name: Provar e entregar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: entrega-lapublisher
  cancel-in-progress: false

jobs:
  provar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # A mesma linha do servidor. Este projeto usa `node:sqlite`, que mudou de
      # comportamento entre versões — provar em outra é provar outro programa.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Todo JavaScript compila
        run: |
          erros=0
          while IFS= read -r f; do
            node --check "$f" || { echo "ERRO de sintaxe: $f"; erros=1; }
          done < <(git ls-files '*.js' '*.cjs')
          exit $erros

      - name: Todo shell script compila
        run: |
          erros=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "ERRO de sintaxe: $f"; erros=1; }
          done < <(git ls-files '*.sh')
          exit $erros

      # O .gitattributes previne o CRLF; isto confere. Prevenção sem
      # conferência é promessa.
      - name: Nenhum script com fim de linha do Windows
        run: |
          if git ls-files '*.sh' | xargs grep -lP '\r$' 2>/dev/null | grep .; then
            echo "Os arquivos acima têm CRLF — o bash não roda assim."
            exit 1
          fi
          echo "todos com LF"

      # ==================================================================
      #  CADA BATERIA COM SEU PRÓPRIO SERVIDOR E SEU PRÓPRIO BANCO.
      #
      #  Elas não foram escritas para dividir estado, e dividir custou caro: a
      #  de API cria uma conta de site apontando para a porta 5195 (onde não há
      #  nada), e a de integração pegava ESSA conta em vez da dela. O Publisher
      #  tentava falar com um endereço morto e a bateria inteira caía com
      #  "Falha de rede ao falar com a plataforma" — um erro que parecia de rede
      #  e era de isolamento.
      #
      #  A causa foi consertada dentro da própria bateria, que agora procura a
      #  conta PELO NOME. O isolamento fica assim mesmo: é como o README manda
      #  rodar, e é o que impede a próxima bateria de herdar sujeira da
      #  anterior.
      #
      #  A ORDEM também importa: a de segurança termina TRAVANDO O IP por 15
      #  minutos — o último teste dela é a trava de força bruta. Ela vem por
      #  último para não fazer as outras falharem por bloqueio.
      #
      #  Cada passo sobe, espera responder, roda e mata PELO PID guardado.
      #  Nunca por pkill com o nome do comando: no servidor de produção todos os
      #  sites rodam a mesma linha com o mesmo usuário, e um pkill assim
      #  derrubou a Imobiliária inteira.
      #
      #  LAP_DATA descartável a cada bateria: o banco de prova nasce e morre com
      #  a execução, longe do banco real, que guarda os tokens das redes dos
      #  clientes. LAP_MIDIA_LOCAL=1 desliga a trava de SSRF porque a bateria
      #  hospeda a imagem em 127.0.0.1 — o servidor grita no boot com ela, e ela
      #  nunca entra em produção.
      # ==================================================================
      - name: Bateria da API pública (37)
        run: |
          mkdir -p /tmp/lap-api
          PORT=5191 LAP_DATA=/tmp/lap-api LAP_MIDIA_LOCAL=1 node server.js & PID=$!
          for i in $(seq 1 25); do curl -sf -o /dev/null http://127.0.0.1:5191/ && break; sleep 1; done
          node testes/api.cjs; R=$?
          kill "$PID" 2>/dev/null || true
          exit $R

      - name: Bateria de ponta a ponta (32)
        run: |
          mkdir -p /tmp/lap-int
          PORT=5191 LAP_DATA=/tmp/lap-int LAP_MIDIA_LOCAL=1 node server.js & PUBPID=$!
          for i in $(seq 1 25); do curl -sf -o /dev/null http://127.0.0.1:5191/ && break; sleep 1; done
          node testes/site-falso.cjs > /tmp/site-falso.log 2>&1 & SITEPID=$!
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:5192/ && break; sleep 1; done
          SEGREDO=$(grep -oE 'SEGREDO=[a-f0-9]+' /tmp/site-falso.log | cut -d= -f2)
          if [ -z "$SEGREDO" ]; then
            echo "não capturei o segredo do site falso:"; cat /tmp/site-falso.log
            kill "$SITEPID" "$PUBPID" 2>/dev/null || true
            exit 1
          fi
          node testes/integracao.cjs "$SEGREDO"; R=$?
          kill "$SITEPID" "$PUBPID" 2>/dev/null || true
          exit $R

      - name: Bateria de segurança (110) — por último, ela trava o IP
        run: |
          mkdir -p /tmp/lap-seg
          PORT=5191 LAP_DATA=/tmp/lap-seg LAP_MIDIA_LOCAL=1 node server.js & PID=$!
          for i in $(seq 1 25); do curl -sf -o /dev/null http://127.0.0.1:5191/ && break; sleep 1; done
          node testes/seguranca.cjs; R=$?
          kill "$PID" 2>/dev/null || true
          exit $R

  entregar:
    needs: provar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Preparar a chave e o host conhecido
        env:
          CHAVE: ${{ secrets.SSH_CHAVE_ENTREGA }}
          HOST_CONHECIDO: ${{ secrets.SSH_HOST_CONHECIDO }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/id_entrega
          chmod 600 ~/.ssh/id_entrega
          # Host FIXADO, não aceito na hora: com StrictHostKeyChecking=no,
          # qualquer servidor que responda no meio do caminho receberia a
          # conexão — e a chave junto.
          printf '%s\n' "$HOST_CONHECIDO" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pedir a entrega
        env:
          DESTINO: ${{ secrets.SSH_DESTINO }}
        run: |
          set -o pipefail
          # Nenhum comando é enviado: o servidor ignora o que viesse aqui e roda
          # o command= preso à chave.
          ssh -T -i ~/.ssh/id_entrega \
              -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes \
              "$DESTINO" 2>&1 | tee saida-da-entrega.txt

      - name: Guardar o log da entrega
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-da-entrega
          path: saida-da-entrega.txt
          retention-days: 30
          if-no-files-found: ignore
