# ==========================================================================
#  /etc/nginx/sites-available/publisher.luizaugust.me
#
#  Instalar (ou use o instalar.sh, que faz isto e mais um pouco):
#    sudo cp nginx/publisher.luizaugust.me.conf /etc/nginx/sites-available/publisher.luizaugust.me
#    sudo ln -s /etc/nginx/sites-available/publisher.luizaugust.me /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d publisher.luizaugust.me --redirect
#
#  O certbot reescreve este arquivo acrescentando o bloco 443 e o redirect.
#  Não edite as linhas que ele inserir.
#
#  CONFERIR depois: `nginx -t` só valida a SINTAXE — ele aprova bloco que o
#  nginx nem chega a carregar (link simbólico quebrado, arquivo fora do
#  sites-enabled). Quem prova que este vhost está mesmo ativo é `nginx -T`.
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name publisher.luizaugust.me;

    # ------------------------------------------------------------------
    #  VÍDEO. Este é o ponto em que a configuração padrão do nginx mataria
    #  o sistema:
    #  · client_max_body_size padrão é 1 MB → todo upload devolveria 413;
    #  · proxy_request_buffering ligado faz o nginx guardar o arquivo INTEIRO
    #    em disco antes de repassar — com 2 GB isso enche /var e o usuário
    #    fica olhando uma barra parada. Desligado, o corpo vai direto para o
    #    Node, que grava em fluxo;
    #  · o timeout padrão de 60s derrubaria o upload no meio.
    # ------------------------------------------------------------------
    client_max_body_size 2048m;
    client_body_timeout 3600s;
    proxy_request_buffering off;

    access_log /var/log/nginx/publisher.access.log;
    error_log  /var/log/nginx/publisher.error.log;

    # Metadados de repositório nunca saem pela web. O server.js já bloqueia,
    # mas aqui a porta fecha antes de chegar na aplicação.
    location ~ /\.(git|env|gitignore) {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    #  Página de manutenção quando a APLICAÇÃO está fora do ar (deploy,
    #  restart, queda). Sem isto o operador veria a tela cinza de 502.
    # ------------------------------------------------------------------
    error_page 502 503 504 /manutencao.html;
    location = /manutencao.html {
        root /var/www/projetos/LA-Publisher;
        internal;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:5190;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # X-Real-IP é o que a aplicação usa para a trava de força bruta: o nginx
        # SOBRESCREVE este cabeçalho com o IP do socket, então o visitante não
        # consegue forjá-lo. Sem ele, sobra o X-Forwarded-For — cujo primeiro
        # item é texto do próprio cliente.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sem este, o cookie de sessão não recebe a marca Secure e o HSTS não
        # é emitido — a aplicação não tem como saber que veio por HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # O YouTube pode levar meia hora recebendo um arquivo grande; o
        # Instagram fica minutos processando um Reels. 60s (o padrão) cortaria
        # a publicação no meio e a fila marcaria erro de rede sem motivo.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}
